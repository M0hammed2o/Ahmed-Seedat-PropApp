<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>body{margin:0}a{color:#1B6BF2}a:hover{color:#0B3FA8}</style></helmet>
<div style="font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:#F3F5F9;color:#0F1B2D;min-height:100%;-webkit-font-smoothing:antialiased">
  <div style="background:#0B1220;color:#fff;padding-bottom:20px">
    <sc-if value="{{ isIOS }}" hint-placeholder-val="{{ true }}"><div style="height:54px"></div></sc-if>
    <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 20px 0">
      <div style="font-size:26px;font-weight:800;letter-spacing:-0.5px">Properties</div>
      <span style="font-size:13px;color:#8FA3C2">{{ countLabel }}</span>
    </div>
    <div style="margin:14px 20px 0;display:flex;align-items:center;gap:10px;height:44px;border-radius:14px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);padding:0 14px;color:#8FA3C2;font-size:14px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>Search properties</div>
    <div style="display:flex;gap:8px;margin:12px 20px 0;overflow:auto">
      <sc-for list="{{ filters }}" as="f" hint-placeholder-count="4"><button onClick="{{ f.go }}" style="flex:none;height:32px;padding:0 14px;border-radius:999px;border:1px solid {{ f.border }};background:{{ f.bg }};color:{{ f.fg }};font:inherit;font-size:13px;font-weight:600;cursor:pointer">{{ f.label }}</button></sc-for>
    </div>
  </div>
  <div style="display:flex;flex-direction:column;gap:14px;margin:16px 20px 0">
    <sc-for list="{{ properties }}" as="p" hint-placeholder-count="3">
      <button style="display:block;width:100%;text-align:left;padding:0;border:0;border-radius:20px;overflow:hidden;font:inherit;color:#fff;cursor:pointer;position:relative;height:230px;background:#0F1B2D;box-shadow:0 6px 18px rgba(11,18,32,.14)" style-active="transform:scale(.99)">
        <sc-if value="{{ p.img }}" hint-placeholder-val="{{ true }}"><img src="{{ p.img }}" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover"></sc-if>
        <sc-if value="{{ p.noImg }}" hint-placeholder-val="{{ false }}"><div style="position:absolute;inset:0;background:repeating-linear-gradient(135deg,#0F1B2D 0 12px,#152540 12px 24px);display:flex;align-items:center;justify-content:center"><svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#3B6FD9" stroke-width="1.2" stroke-linejoin="round"><rect x="4" y="3" width="10" height="18" rx="1"></rect><path d="M14 9h5a1 1 0 0 1 1 1v11h-6M7 7h2M7 11h2M7 15h2"></path></svg></div></sc-if>
        <div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,18,32,.15) 0%,rgba(11,18,32,.05) 35%,rgba(11,18,32,.92) 100%)"></div>
        <span style="position:absolute;top:14px;left:14px;font-size:11px;font-weight:700;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.16);backdrop-filter:blur(6px);color:#fff;border:1px solid rgba(255,255,255,.2)">{{ p.type }}</span>
        <span style="position:absolute;top:14px;right:14px;font-size:11px;font-weight:700;padding:5px 10px;border-radius:999px;background:{{ p.statusBg }};color:{{ p.statusFg }}">{{ p.status }}</span>
        <div style="position:absolute;left:16px;right:16px;bottom:14px">
          <div style="font-size:18px;font-weight:700;letter-spacing:-0.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ p.name }}</div>
          <div style="font-size:12px;color:#B7C6E0;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ p.addr }}</div>
          <div style="display:flex;gap:18px;margin-top:12px">
            <div><div style="font-size:10px;color:#8FA3C2;text-transform:uppercase;letter-spacing:.5px;font-weight:600">Collected</div><div style="font-size:15px;font-weight:700;margin-top:1px">{{ p.collected }}</div></div>
            <div><div style="font-size:10px;color:#8FA3C2;text-transform:uppercase;letter-spacing:.5px;font-weight:600">Expected</div><div style="font-size:15px;font-weight:700;margin-top:1px">{{ p.expected }}</div></div>
            <div style="margin-left:auto;text-align:right"><div style="font-size:10px;color:#8FA3C2;text-transform:uppercase;letter-spacing:.5px;font-weight:600">{{ p.units }} units</div><div style="font-size:15px;font-weight:700;margin-top:1px">{{ p.occ }}% let</div></div>
          </div>
          <div style="height:4px;border-radius:999px;background:rgba(255,255,255,.2);margin-top:10px;overflow:hidden"><div style="width:{{ p.occ }}%;height:100%;background:#5EA2FF;border-radius:999px"></div></div>
        </div>
      </button>
    </sc-for>
  </div>
  <div style="height:24px"></div>
  <sc-if value="{{ isIOS }}" hint-placeholder-val="{{ true }}">
    <nav style="position:sticky;bottom:0;display:grid;grid-template-columns:repeat(4,1fr);background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-top:1px solid #E5E9F0;padding:8px 8px 28px">
      <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="4"><button style="display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:transparent;font:inherit;font-size:11px;font-weight:600;color:{{ t.color }};padding:6px 0;min-height:44px">{{ t.icon }}<span>{{ t.label }}</span></button></sc-for>
    </nav>
  </sc-if>
  <sc-if value="{{ isAndroid }}" hint-placeholder-val="{{ false }}">
    <nav style="position:sticky;bottom:0;display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border-top:1px solid #E5E9F0;padding:10px 8px 12px">
      <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="4"><button style="display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:transparent;font:inherit;font-size:12px;font-weight:600;color:{{ t.color }};padding:0"><span style="width:60px;height:32px;border-radius:16px;background:{{ t.pill }};display:flex;align-items:center;justify-content:center">{{ t.icon }}</span><span>{{ t.label }}</span></button></sc-for>
    </nav>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:402,&quot;height&quot;:874},&quot;platform&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;ios&quot;,&quot;android&quot;],&quot;default&quot;:&quot;ios&quot;,&quot;tsType&quot;:&quot;'ios'|'android'&quot;}}">
class Component extends DCLogic {
  state = { filter: 0 };
  icon(d, color) { return React.createElement('svg', { width: 24, height: 24, viewBox: '0 0 24 24', fill: 'none', stroke: color, strokeWidth: 1.9, strokeLinecap: 'round', strokeLinejoin: 'round' }, ...d.map((p, i) => React.createElement('path', { key: i, d: p }))); }
  renderVals() {
    const platform = this.props.platform ?? 'ios';
    const all = [
      { name: 'Musgrave Flats', addr: '34 Peter Mokaba Ridge, Berea, Durban', type: 'Residential', status: 'Active', statusBg: '#DCFCE7', statusFg: '#15803D', units: '5', expected: 'R 20,000', collected: 'R 20,000', occ: 20, img: null, noImg: true, k: 'res' },
      { name: 'Midlands Builders Supply Edendale', addr: 'Edendale Road, Camps Drift, Pietermaritzburg', type: 'Retail', status: 'Active', statusBg: '#DCFCE7', statusFg: '#15803D', units: '3', expected: 'R 42,000', collected: 'R 36,500', occ: 67, img: 'assets/prop-edendale.png', noImg: false, k: 'com' },
      { name: 'Midlands Builders Supply', addr: '2 Manchester Road, Northdale, Pietermaritzburg', type: 'Commercial', status: 'Active', statusBg: '#DCFCE7', statusFg: '#15803D', units: '1', expected: 'R 18,000', collected: 'R 18,000', occ: 100, img: 'assets/prop-northdale.png', noImg: false, k: 'com' },
      { name: 'Salta Sibaya Estate', addr: 'Crane Avenue, eThekwini, KwaZulu-Natal', type: 'Vacant land', status: 'Attention', statusBg: '#FEF3C7', statusFg: '#B45309', units: '0', expected: 'R 0', collected: 'R 0', occ: 0, img: 'assets/prop-salta.png', noImg: false, k: 'land' },
    ];
    const names = ['All', 'Residential', 'Commercial', 'Land'], keys = [null, 'res', 'com', 'land'], f = this.state.filter;
    const properties = all.filter(p => !keys[f] || p.k === keys[f]);
    const filters = names.map((label, i) => ({ label, go: () => this.setState({ filter: i }), bg: i === f ? '#fff' : 'transparent', fg: i === f ? '#0B1220' : '#B7C6E0', border: i === f ? '#fff' : 'rgba(255,255,255,.2)' }));
    const defs = [['Home', ['M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z']], ['Properties', ['M4 21V4a1 1 0 0 1 1-1h8a1 1 0 0 1 1 1v17', 'M14 9h5a1 1 0 0 1 1 1v11', 'M3 21h18M7 7h2M7 11h2M7 15h2']], ['Activity', ['M3 12h4l3-7 4 14 3-7h4']], ['More', ['M5 12h.01M12 12h.01M19 12h.01', 'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18z']]];
    const tabs = defs.map(([label, d], i) => ({ label, color: i === 1 ? '#0F1B2D' : '#7B8794', icon: this.icon(d, i === 1 ? '#1B6BF2' : '#7B8794'), pill: i === 1 ? '#E8F0FE' : 'transparent' }));
    return { isIOS: platform === 'ios', isAndroid: platform === 'android', filters, properties, countLabel: properties.length + ' properties', tabs };
  }
}
</script>
</body>
</html>
