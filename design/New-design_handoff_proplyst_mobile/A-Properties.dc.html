<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>body{margin:0}a{color:#1B6BF2}a:hover{color:#0B3FA8}</style></helmet>
<div style="font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:#F6F8FB;color:#0F1B2D;min-height:100%;-webkit-font-smoothing:antialiased">
  <sc-if value="{{ isIOS }}" hint-placeholder-val="{{ true }}"><div style="height:54px"></div></sc-if>
  <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 20px 0">
    <div style="font-size:28px;font-weight:800;letter-spacing:-0.5px">Properties</div>
    <button aria-label="Filter" style="width:40px;height:40px;border-radius:50%;border:1px solid #E5E9F0;background:#fff;display:flex;align-items:center;justify-content:center;color:#3A4A5E;cursor:pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M7 12h10M10 18h4"></path></svg></button>
  </div>
  <div style="margin:14px 20px 0;display:flex;align-items:center;gap:10px;height:44px;border-radius:14px;background:#fff;border:1px solid #E5E9F0;padding:0 14px;color:#98A2B3;font-size:14px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>Search properties</div>
  <div style="display:flex;gap:8px;margin:12px 20px 0;overflow:auto">
    <sc-for list="{{ filters }}" as="f" hint-placeholder-count="4"><button onClick="{{ f.go }}" style="flex:none;height:34px;padding:0 14px;border-radius:999px;border:1px solid {{ f.border }};background:{{ f.bg }};color:{{ f.fg }};font:inherit;font-size:13px;font-weight:600;cursor:pointer">{{ f.label }}</button></sc-for>
  </div>
  <div style="display:flex;justify-content:space-between;margin:16px 20px 0;font-size:13px;color:#5B6B7F"><span>{{ countLabel }}</span><span>Sorted by income</span></div>
  <div style="display:flex;flex-direction:column;gap:14px;margin:10px 20px 0">
    <sc-for list="{{ properties }}" as="p" hint-placeholder-count="3">
      <button style="display:block;width:100%;text-align:left;padding:0;border:1px solid #E5E9F0;border-radius:20px;background:#fff;overflow:hidden;font:inherit;color:inherit;cursor:pointer;box-shadow:0 1px 2px rgba(15,27,45,.04)" style-active="transform:scale(.99)">
        <div style="position:relative;height:160px;background:#0F1B2D">
          <sc-if value="{{ p.img }}" hint-placeholder-val="{{ true }}"><img src="{{ p.img }}" alt="" style="width:100%;height:100%;object-fit:cover;display:block"></sc-if>
          <sc-if value="{{ p.noImg }}" hint-placeholder-val="{{ false }}"><div style="width:100%;height:100%;background:repeating-linear-gradient(135deg,#0F1B2D 0 12px,#152540 12px 24px);display:flex;align-items:center;justify-content:center"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#3B6FD9" stroke-width="1.4" stroke-linejoin="round"><rect x="4" y="3" width="10" height="18" rx="1"></rect><path d="M14 9h5a1 1 0 0 1 1 1v11h-6M7 7h2M7 11h2M7 15h2"></path></svg></div></sc-if>
          <span style="position:absolute;top:12px;left:12px;font-size:11px;font-weight:700;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.92);color:#0F1B2D">{{ p.type }}</span>
          <span style="position:absolute;top:12px;right:12px;font-size:11px;font-weight:700;padding:5px 10px;border-radius:999px;background:{{ p.statusBg }};color:{{ p.statusFg }}">{{ p.status }}</span>
        </div>
        <div style="padding:14px 16px 16px">
          <div style="font-size:17px;font-weight:700;letter-spacing:-0.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ p.name }}</div>
          <div style="font-size:13px;color:#5B6B7F;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ p.addr }}</div>
          <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px">
            <div><div style="font-size:11px;color:#98A2B3;text-transform:uppercase;letter-spacing:.4px;font-weight:600">Units</div><div style="font-size:15px;font-weight:700;margin-top:2px">{{ p.units }}</div></div>
            <div><div style="font-size:11px;color:#98A2B3;text-transform:uppercase;letter-spacing:.4px;font-weight:600">Expected</div><div style="font-size:15px;font-weight:700;margin-top:2px">{{ p.expected }}</div></div>
            <div><div style="font-size:11px;color:#98A2B3;text-transform:uppercase;letter-spacing:.4px;font-weight:600">Collected</div><div style="font-size:15px;font-weight:700;margin-top:2px;color:#16A34A">{{ p.collected }}</div></div>
          </div>
          <div style="display:flex;justify-content:space-between;align-items:center;margin-top:14px;font-size:12px;color:#5B6B7F"><span>Occupancy · {{ p.occText }}</span><span style="font-weight:700;color:#0F1B2D">{{ p.occ }}%</span></div>
          <div style="height:5px;border-radius:999px;background:#EEF1F5;margin-top:6px;overflow:hidden"><div style="width:{{ p.occ }}%;height:100%;background:#1B6BF2;border-radius:999px"></div></div>
        </div>
      </button>
    </sc-for>
  </div>
  <div style="height:24px"></div>
  <sc-if value="{{ isIOS }}" hint-placeholder-val="{{ true }}">
    <nav style="position:sticky;bottom:0;display:grid;grid-template-columns:repeat(4,1fr);background:rgba(255,255,255,.92);backdrop-filter:blur(12px);border-top:1px solid #E5E9F0;padding:8px 8px 28px">
      <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="4"><button style="display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:transparent;font:inherit;font-size:11px;font-weight:600;color:{{ t.color }};padding:6px 0;min-height:44px">{{ t.icon }}<span>{{ t.label }}</span></button></sc-for>
    </nav>
  </sc-if>
  <sc-if value="{{ isAndroid }}" hint-placeholder-val="{{ false }}">
    <nav style="position:sticky;bottom:0;display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border-top:1px solid #E5E9F0;padding:10px 8px 12px">
      <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="4"><button style="display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:transparent;font:inherit;font-size:12px;font-weight:600;color:{{ t.color }};padding:0"><span style="width:60px;height:32px;border-radius:16px;background:{{ t.pill }};display:flex;align-items:center;justify-content:center">{{ t.icon }}</span><span>{{ t.label }}</span></button></sc-for>
    </nav>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:402,&quot;height&quot;:874},&quot;platform&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;ios&quot;,&quot;android&quot;],&quot;default&quot;:&quot;ios&quot;,&quot;tsType&quot;:&quot;'ios'|'android'&quot;}}">
class Component extends DCLogic {
  state = { filter: 0 };
  icon(d, color) { return React.createElement('svg', { width: 24, height: 24, viewBox: '0 0 24 24', fill: 'none', stroke: color, strokeWidth: 1.9, strokeLinecap: 'round', strokeLinejoin: 'round' }, ...d.map((p, i) => React.createElement('path', { key: i, d: p }))); }
  renderVals() {
    const platform = this.props.platform ?? 'ios';
    const all = [
      { name: 'Musgrave Flats', addr: '34 Peter Mokaba Ridge, Berea, Durban', type: 'Residential', status: 'Active', statusBg: '#DCFCE7', statusFg: '#15803D', units: '5', expected: 'R 20,000', collected: 'R 20,000', occ: 20, occText: '1 of 5 let', img: null, noImg: true, k: 'res' },
      { name: 'Midlands Builders Supply Edendale', addr: 'Edendale Road, Camps Drift, Pietermaritzburg', type: 'Retail', status: 'Active', statusBg: '#DCFCE7', statusFg: '#15803D', units: '3', expected: 'R 42,000', collected: 'R 36,500', occ: 67, occText: '2 of 3 let', img: 'assets/prop-edendale.png', noImg: false, k: 'com' },
      { name: 'Midlands Builders Supply', addr: '2 Manchester Road, Northdale, Pietermaritzburg', type: 'Commercial', status: 'Active', statusBg: '#DCFCE7', statusFg: '#15803D', units: '1', expected: 'R 18,000', collected: 'R 18,000', occ: 100, occText: '1 of 1 let', img: 'assets/prop-northdale.png', noImg: false, k: 'com' },
      { name: 'Salta Sibaya Estate', addr: 'Crane Avenue, eThekwini, KwaZulu-Natal', type: 'Vacant land', status: 'Attention', statusBg: '#FEF3C7', statusFg: '#B45309', units: '0', expected: 'R 0', collected: 'R 0', occ: 0, occText: 'no units', img: 'assets/prop-salta.png', noImg: false, k: 'land' },
    ];
    const names = ['All', 'Residential', 'Commercial', 'Land'], keys = [null, 'res', 'com', 'land'];
    const f = this.state.filter;
    const properties = all.filter(p => !keys[f] || p.k === keys[f]);
    const filters = names.map((label, i) => ({ label, go: () => this.setState({ filter: i }), bg: i === f ? '#1B6BF2' : '#fff', fg: i === f ? '#fff' : '#3A4A5E', border: i === f ? '#1B6BF2' : '#E5E9F0' }));
    const defs = [['Home', ['M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z']], ['Properties', ['M4 21V4a1 1 0 0 1 1-1h8a1 1 0 0 1 1 1v17', 'M14 9h5a1 1 0 0 1 1 1v11', 'M3 21h18M7 7h2M7 11h2M7 15h2']], ['Activity', ['M3 12h4l3-7 4 14 3-7h4']], ['More', ['M5 12h.01M12 12h.01M19 12h.01', 'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18z']]];
    const tabs = defs.map(([label, d], i) => ({ label, color: i === 1 ? '#1B6BF2' : '#7B8794', icon: this.icon(d, i === 1 ? '#1B6BF2' : '#7B8794'), pill: i === 1 ? '#E8F0FE' : 'transparent' }));
    return { isIOS: platform === 'ios', isAndroid: platform === 'android', filters, properties, countLabel: properties.length + ' properties', tabs };
  }
}
</script>
</body>
</html>
