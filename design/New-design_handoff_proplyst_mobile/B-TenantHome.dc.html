<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>body{margin:0}a{color:#1B6BF2}a:hover{color:#0B3FA8}</style></helmet>
<div style="font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:#F3F5F9;color:#0F1B2D;min-height:100%;-webkit-font-smoothing:antialiased">
  <div style="background:#0B1220;color:#fff;padding-bottom:70px;position:relative;overflow:hidden">
    <div style="position:absolute;top:-140px;right:-100px;width:340px;height:340px;border-radius:50%;background:radial-gradient(closest-side,rgba(27,107,242,.4),rgba(27,107,242,0))"></div>
    <sc-if value="{{ isIOS }}" hint-placeholder-val="{{ true }}"><div style="height:54px"></div></sc-if>
    <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 20px 0;position:relative">
      <div style="display:flex;align-items:center;gap:8px"><img src="assets/logo-mark.png" alt="" style="height:26px;width:auto"><span style="font-size:16px;font-weight:700">Prop<span style="color:#5EA2FF">lyst</span></span></div>
      <div style="display:flex;gap:8px">
        <button aria-label="Notifications" style="width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center;color:#fff;cursor:pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"></path><path d="M10 21h4"></path></svg></button>
        <div style="width:40px;height:40px;border-radius:50%;background:#1B6BF2;color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center">LN</div>
      </div>
    </div>
    <div style="padding:26px 20px 0;position:relative">
      <div style="font-size:14px;color:#8FA3C2">Hi Lerato · Unit AQ-101, Atlas Quarter</div>
      <div style="font-size:13px;color:#8FA3C2;margin-top:10px">Rent due 1 October</div>
      <div style="font-size:44px;font-weight:800;letter-spacing:-1.4px;line-height:1.05;margin-top:6px">R 14,500</div>
      <div style="font-size:13px;color:#8FA3C2;margin-top:8px">{{ dueSub }}</div>
    </div>
  </div>
  <div style="margin:-48px 20px 0;background:#fff;border-radius:18px;box-shadow:0 8px 24px rgba(11,18,32,.10);padding:14px;position:relative;display:flex;gap:10px">
    <button onClick="{{ togglePaid }}" style="flex:1;height:50px;border:0;border-radius:12px;background:{{ payBg }};color:{{ payFg }};font:inherit;font-size:15px;font-weight:700;cursor:pointer">{{ payLabel }}</button>
    <button style="width:50px;height:50px;border:1px solid #E5E9F0;border-radius:12px;background:#fff;color:#0F1B2D;display:flex;align-items:center;justify-content:center;cursor:pointer" aria-label="View invoice"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M6 3h8l4 4v14H6z M14 3v4h4M9 12h6M9 16h6"></path></svg></button>
  </div>
  <div style="margin:16px 20px 0;display:grid;grid-template-columns:1fr 1fr;gap:12px">
    <div style="background:#fff;border-radius:16px;padding:14px 16px;box-shadow:0 1px 2px rgba(15,27,45,.04)">
      <div style="font-size:12px;color:#5B6B7F">Lease progress</div><div style="font-size:20px;font-weight:800;letter-spacing:-0.4px;margin-top:4px">9 <span style="font-size:13px;color:#98A2B3;font-weight:600">/ 12 mo</span></div>
      <div style="height:5px;border-radius:999px;background:#EEF1F5;margin-top:10px;overflow:hidden"><div style="width:75%;height:100%;background:#1B6BF2;border-radius:999px"></div></div>
    </div>
    <div style="background:#fff;border-radius:16px;padding:14px 16px;box-shadow:0 1px 2px rgba(15,27,45,.04)">
      <div style="font-size:12px;color:#5B6B7F">Last payment</div><div style="font-size:20px;font-weight:800;letter-spacing:-0.4px;margin-top:4px">R 14,500</div>
      <div style="font-size:12px;color:#15803D;font-weight:600;margin-top:8px">Confirmed · 1 Sep</div>
    </div>
  </div>
  <div style="margin:24px 20px 0">
    <div style="display:flex;justify-content:space-between;align-items:baseline"><span style="font-size:17px;font-weight:700">My requests</span><a href="#" style="font-size:13px;font-weight:600;text-decoration:none">New request</a></div>
    <div style="display:flex;flex-direction:column;gap:8px;margin-top:12px">
      <sc-for list="{{ requests }}" as="r" hint-placeholder-count="2">
        <button style="display:flex;align-items:center;gap:12px;padding:12px 14px;border:0;border-radius:16px;background:#fff;text-align:left;font:inherit;color:inherit;cursor:pointer;box-shadow:0 1px 2px rgba(15,27,45,.04)">
          <div style="width:44px;height:44px;border-radius:12px;background:repeating-linear-gradient(135deg,#EEF1F5 0 6px,#F6F8FB 6px 12px);flex:none"></div>
          <div style="flex:1;min-width:0"><div style="font-size:15px;font-weight:600">{{ r.title }}</div><div style="font-size:12px;color:#98A2B3;margin-top:2px">{{ r.date }}</div></div>
          <span style="font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:{{ r.bg }};color:{{ r.fg }}">{{ r.status }}</span>
        </button>
      </sc-for>
    </div>
  </div>
  <div style="margin:24px 20px 0">
    <span style="font-size:17px;font-weight:700">Notices &amp; documents</span>
    <div style="background:#fff;border-radius:16px;margin-top:12px;padding:14px 16px;display:flex;gap:12px;box-shadow:0 1px 2px rgba(15,27,45,.04)">
      <div style="width:36px;height:36px;border-radius:10px;background:#0B1220;color:#5EA2FF;display:flex;align-items:center;justify-content:center;flex:none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 8v5M12 16h.01"></path><circle cx="12" cy="12" r="9"></circle></svg></div>
      <div><div style="font-size:14px;font-weight:600">Water interruption</div><div style="font-size:13px;color:#5B6B7F;margin-top:2px">Tuesday 08:00–12:00. Municipal maintenance on Main Road.</div></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px">
      <button style="display:flex;align-items:center;gap:10px;padding:12px 14px;border:0;border-radius:14px;background:#fff;font:inherit;font-size:13px;font-weight:600;color:#0F1B2D;text-align:left;cursor:pointer;box-shadow:0 1px 2px rgba(15,27,45,.04)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1B6BF2" stroke-width="2" stroke-linejoin="round"><path d="M6 3h8l4 4v14H6z M14 3v4h4"></path></svg>Lease agreement</button>
      <button style="display:flex;align-items:center;gap:10px;padding:12px 14px;border:0;border-radius:14px;background:#fff;font:inherit;font-size:13px;font-weight:600;color:#0F1B2D;text-align:left;cursor:pointer;box-shadow:0 1px 2px rgba(15,27,45,.04)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1B6BF2" stroke-width="2" stroke-linejoin="round"><path d="M6 3h8l4 4v14H6z M14 3v4h4"></path></svg>House rules</button>
    </div>
  </div>
  <div style="height:24px"></div>
  <sc-if value="{{ isIOS }}" hint-placeholder-val="{{ true }}">
    <nav style="position:sticky;bottom:0;display:grid;grid-template-columns:repeat(4,1fr);background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-top:1px solid #E5E9F0;padding:8px 8px 28px">
      <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="4"><button style="display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:transparent;font:inherit;font-size:11px;font-weight:600;color:{{ t.color }};padding:6px 0;min-height:44px">{{ t.icon }}<span>{{ t.label }}</span></button></sc-for>
    </nav>
  </sc-if>
  <sc-if value="{{ isAndroid }}" hint-placeholder-val="{{ false }}">
    <nav style="position:sticky;bottom:0;display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border-top:1px solid #E5E9F0;padding:10px 8px 12px">
      <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="4"><button style="display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:transparent;font:inherit;font-size:12px;font-weight:600;color:{{ t.color }};padding:0"><span style="width:60px;height:32px;border-radius:16px;background:{{ t.pill }};display:flex;align-items:center;justify-content:center">{{ t.icon }}</span><span>{{ t.label }}</span></button></sc-for>
    </nav>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:402,&quot;height&quot;:874},&quot;platform&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;ios&quot;,&quot;android&quot;],&quot;default&quot;:&quot;ios&quot;,&quot;tsType&quot;:&quot;'ios'|'android'&quot;}}">
class Component extends DCLogic {
  state = { reported: false };
  icon(d, color) { return React.createElement('svg', { width: 24, height: 24, viewBox: '0 0 24 24', fill: 'none', stroke: color, strokeWidth: 1.9, strokeLinecap: 'round', strokeLinejoin: 'round' }, ...d.map((p, i) => React.createElement('path', { key: i, d: p }))); }
  renderVals() {
    const platform = this.props.platform ?? 'ios', r = this.state.reported;
    const defs = [['Home', ['M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z']], ['Payments', ['M3 7h18v10H3z', 'M3 11h18', 'M7 15h3']], ['Requests', ['M14.7 6.3a4 4 0 0 0 5 5L13 18a2.5 2.5 0 0 1-3.5-3.5z']], ['Profile', ['M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8z', 'M4 21a8 8 0 0 1 16 0']]];
    const tabs = defs.map(([label, d], i) => ({ label, color: i === 0 ? '#0F1B2D' : '#7B8794', icon: this.icon(d, i === 0 ? '#1B6BF2' : '#7B8794'), pill: i === 0 ? '#E8F0FE' : 'transparent' }));
    return {
      isIOS: platform === 'ios', isAndroid: platform === 'android', tabs,
      dueSub: r ? 'Payment reported · awaiting confirmation' : 'Due in 29 days · no outstanding balance',
      payLabel: r ? 'Payment reported ✓' : 'Report payment', payBg: r ? '#E8F0FE' : '#1B6BF2', payFg: r ? '#1B6BF2' : '#fff',
      togglePaid: () => this.setState(s => ({ reported: !s.reported })),
      requests: [{ title: 'Geyser leak', date: 'Opened 28 Aug', status: 'In progress', bg: '#E8F0FE', fg: '#1B6BF2' }, { title: 'Extractor fan', date: 'Closed 14 Aug', status: 'Completed', bg: '#DCFCE7', fg: '#15803D' }],
    };
  }
}
</script>
</body>
</html>
