<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>body{margin:0}a{color:#1B6BF2}a:hover{color:#0B3FA8}</style></helmet>
<div style="font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:#EEF3FB;color:#0F1B2D;min-height:100%;-webkit-font-smoothing:antialiased">
  <sc-if value="{{ isIOS }}" hint-placeholder-val="{{ true }}"><div style="height:54px"></div></sc-if>
  <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 20px 0">
    <div><div style="font-size:12px;color:#5B6B7F">Portfolio</div><div style="font-size:26px;font-weight:800;letter-spacing:-0.5px;margin-top:-2px">Properties</div></div>
    <div style="display:flex;gap:8px"><button aria-label="Search" style="width:40px;height:40px;border-radius:50%;border:0;background:#fff;display:flex;align-items:center;justify-content:center;color:#3A4A5E;cursor:pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg></button><button aria-label="Map" style="width:40px;height:40px;border-radius:50%;border:0;background:#fff;display:flex;align-items:center;justify-content:center;color:#3A4A5E;cursor:pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z M9 4v14M15 6v14"></path></svg></button></div>
  </div>
  <div style="display:flex;gap:8px;margin:18px 20px 0;overflow:auto">
    <sc-for list="{{ filters }}" as="f" hint-placeholder-count="4"><button onClick="{{ f.go }}" style="flex:none;height:36px;padding:0 16px;border-radius:999px;border:0;background:{{ f.bg }};color:{{ f.fg }};font:inherit;font-size:13px;font-weight:600;cursor:pointer">{{ f.label }}</button></sc-for>
  </div>
  <div style="margin:20px 0 0 20px;display:flex;gap:12px;overflow:auto;padding-right:20px;padding-bottom:6px">
    <sc-for list="{{ featured }}" as="p" hint-placeholder-count="3">
      <button style="flex:none;width:250px;text-align:left;padding:0;border:0;border-radius:24px;background:#fff;overflow:hidden;font:inherit;color:inherit;cursor:pointer" style-active="transform:scale(.99)">
        <div style="position:relative;height:150px;margin:6px;border-radius:18px;overflow:hidden;background:#0F1B2D">
          <sc-if value="{{ p.img }}" hint-placeholder-val="{{ true }}"><img src="{{ p.img }}" alt="" style="width:100%;height:100%;object-fit:cover;display:block"></sc-if>
          <sc-if value="{{ p.noImg }}" hint-placeholder-val="{{ false }}"><div style="width:100%;height:100%;background:repeating-linear-gradient(135deg,#DCE6F7 0 10px,#E8EFFA 10px 20px);display:flex;align-items:center;justify-content:center"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#1B6BF2" stroke-width="1.4" stroke-linejoin="round"><rect x="4" y="3" width="10" height="18" rx="1"></rect><path d="M14 9h5a1 1 0 0 1 1 1v11h-6M7 7h2M7 11h2M7 15h2"></path></svg></div></sc-if>
          <span style="position:absolute;top:10px;left:10px;font-size:11px;font-weight:700;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.92);color:#0F1B2D">{{ p.occ }}% let</span>
        </div>
        <div style="padding:8px 14px 14px">
          <div style="font-size:16px;font-weight:700;letter-spacing:-0.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ p.name }}</div>
          <div style="font-size:12px;color:#5B6B7F;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ p.addr }}</div>
          <div style="display:flex;justify-content:space-between;align-items:baseline;margin-top:12px"><span style="font-size:18px;font-weight:800;letter-spacing:-0.4px">{{ p.collected }}</span><span style="font-size:12px;color:#5B6B7F">of {{ p.expected }}</span></div>
          <div style="height:5px;border-radius:999px;background:#EEF3FB;margin-top:8px;overflow:hidden"><div style="width:{{ p.colPct }}%;height:100%;background:#1B6BF2;border-radius:999px"></div></div>
        </div>
      </button>
    </sc-for>
  </div>
  <div style="margin:22px 20px 0;display:flex;justify-content:space-between;align-items:baseline;padding:0 4px"><span style="font-size:16px;font-weight:700">{{ countLabel }}</span><span style="font-size:13px;color:#5B6B7F">By income</span></div>
  <div style="margin:10px 20px 0;background:#fff;border-radius:22px;padding:6px">
    <sc-for list="{{ properties }}" as="p" hint-placeholder-count="4">
      <button style="width:100%;display:flex;align-items:center;gap:12px;padding:10px;border:0;border-radius:16px;background:#fff;text-align:left;font:inherit;color:inherit;cursor:pointer" style-hover="background:#F3F6FB">
        <div style="width:64px;height:56px;border-radius:14px;overflow:hidden;flex:none;background:#DCE6F7">
          <sc-if value="{{ p.img }}" hint-placeholder-val="{{ true }}"><img src="{{ p.img }}" alt="" style="width:100%;height:100%;object-fit:cover;display:block"></sc-if>
          <sc-if value="{{ p.noImg }}" hint-placeholder-val="{{ false }}"><div style="width:100%;height:100%;background:repeating-linear-gradient(135deg,#DCE6F7 0 6px,#E8EFFA 6px 12px)"></div></sc-if>
        </div>
        <div style="flex:1;min-width:0"><div style="font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ p.name }}</div><div style="font-size:12px;color:#5B6B7F;margin-top:2px">{{ p.units }} units · {{ p.occ }}% let · {{ p.type }}</div></div>
        <div style="text-align:right"><div style="font-size:15px;font-weight:700">{{ p.collected }}</div><div style="font-size:11px;color:{{ p.deltaColor }};margin-top:2px;font-weight:600">{{ p.delta }}</div></div>
      </button>
    </sc-for>
  </div>
  <div style="height:110px"></div>
  <nav style="position:sticky;bottom:{{ navBottom }};margin:0 20px;padding:0 0 12px;display:flex;justify-content:center;pointer-events:none">
    <div style="pointer-events:auto;display:flex;gap:4px;background:#0F1B2D;border-radius:999px;padding:6px;box-shadow:0 12px 32px rgba(15,27,45,.28)">
      <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="4"><button style="display:flex;align-items:center;gap:8px;height:48px;padding:0 {{ t.pad }};border:0;border-radius:999px;background:{{ t.pill }};font:inherit;font-size:13px;font-weight:600;color:{{ t.color }};cursor:pointer">{{ t.icon }}<span style="display:{{ t.labelDisplay }}">{{ t.label }}</span></button></sc-for>
    </div>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:402,&quot;height&quot;:874},&quot;platform&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;ios&quot;,&quot;android&quot;],&quot;default&quot;:&quot;ios&quot;,&quot;tsType&quot;:&quot;'ios'|'android'&quot;}}">
class Component extends DCLogic {
  state = { filter: 0 };
  icon(d, color) { return React.createElement('svg', { width: 22, height: 22, viewBox: '0 0 24 24', fill: 'none', stroke: color, strokeWidth: 2, strokeLinecap: 'round', strokeLinejoin: 'round' }, ...d.map((p, i) => React.createElement('path', { key: i, d: p }))); }
  renderVals() {
    const platform = this.props.platform ?? 'ios';
    const all = [
      { name: 'Midlands Builders Supply Edendale', addr: 'Edendale Road, Camps Drift, Pietermaritzburg', type: 'Retail', units: '3', expected: 'R 42,000', collected: 'R 36,500', colPct: 87, occ: 67, img: 'assets/prop-edendale.png', noImg: false, k: 'com', delta: 'R 5,500 due', deltaColor: '#B45309' },
      { name: 'Musgrave Flats', addr: '34 Peter Mokaba Ridge, Berea, Durban', type: 'Residential', units: '5', expected: 'R 20,000', collected: 'R 20,000', colPct: 100, occ: 20, img: null, noImg: true, k: 'res', delta: 'Fully paid', deltaColor: '#15803D' },
      { name: 'Midlands Builders Supply', addr: '2 Manchester Road, Northdale, Pietermaritzburg', type: 'Commercial', units: '1', expected: 'R 18,000', collected: 'R 18,000', colPct: 100, occ: 100, img: 'assets/prop-northdale.png', noImg: false, k: 'com', delta: 'Fully paid', deltaColor: '#15803D' },
      { name: 'Salta Sibaya Estate', addr: 'Crane Avenue, eThekwini', type: 'Vacant land', units: '0', expected: 'R 0', collected: 'R 0', colPct: 0, occ: 0, img: 'assets/prop-salta.png', noImg: false, k: 'land', delta: 'No units', deltaColor: '#7B8794' },
    ];
    const names = ['All', 'Residential', 'Commercial', 'Land'], keys = [null, 'res', 'com', 'land'], f = this.state.filter;
    const properties = all.filter(p => !keys[f] || p.k === keys[f]);
    const filters = names.map((label, i) => ({ label, go: () => this.setState({ filter: i }), bg: i === f ? '#0F1B2D' : '#fff', fg: i === f ? '#fff' : '#3A4A5E' }));
    const defs = [['Home', ['M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z']], ['Properties', ['M4 21V4a1 1 0 0 1 1-1h8a1 1 0 0 1 1 1v17', 'M14 9h5a1 1 0 0 1 1 1v11', 'M3 21h18M7 7h2M7 11h2M7 15h2']], ['Activity', ['M3 12h4l3-7 4 14 3-7h4']], ['More', ['M5 12h.01M12 12h.01M19 12h.01', 'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18z']]];
    const tabs = defs.map(([label, d], i) => { const a = i === 1; return { label, labelDisplay: a ? 'inline' : 'none', color: a ? '#0F1B2D' : '#B7C6E0', icon: this.icon(d, a ? '#0F1B2D' : '#B7C6E0'), pill: a ? '#fff' : 'transparent', pad: a ? '16px' : '13px' }; });
    return { isIOS: platform === 'ios', navBottom: platform === 'ios' ? '22px' : '8px', filters, featured: properties.slice(0, 3), properties, countLabel: 'All ' + properties.length, tabs };
  }
}
</script>
</body>
</html>
