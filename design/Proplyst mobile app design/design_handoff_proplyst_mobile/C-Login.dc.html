<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>body{margin:0}a{color:#1B6BF2}a:hover{color:#0B3FA8}@keyframes pl-spin{to{transform:rotate(360deg)}}</style></helmet>
<div style="font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:#EEF3FB;color:#0F1B2D;min-height:100%;height:100%;display:flex;flex-direction:column;padding:0 24px 32px;box-sizing:border-box;-webkit-font-smoothing:antialiased">
  <sc-if value="{{ isIOS }}" hint-placeholder-val="{{ true }}"><div style="height:54px"></div></sc-if>
  <div style="display:flex;justify-content:center;padding-top:36px"><div style="width:112px;height:112px;border-radius:32px;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 12px 32px rgba(27,107,242,.12)"><img src="assets/logo-mark.png" alt="Proplyst" style="width:64px;height:70px;object-fit:contain"></div></div>
  <div style="text-align:center;margin-top:26px">
    <div style="font-size:26px;font-weight:800;letter-spacing:-0.5px">Welcome to Proplyst</div>
    <div style="font-size:14px;color:#5B6B7F;margin-top:6px">Property intelligence simplified.</div>
  </div>
  <div style="background:#fff;border-radius:24px;padding:20px;margin-top:28px;display:flex;flex-direction:column;gap:10px;box-shadow:0 1px 2px rgba(15,27,45,.03)">
    <div style="display:flex;flex-direction:column;gap:2px;background:#F3F6FB;border-radius:14px;padding:10px 16px" style-focus="box-shadow:0 0 0 2px #1B6BF2">
      <span style="font-size:11px;font-weight:600;color:#7B8794;text-transform:uppercase;letter-spacing:.4px">Email</span>
      <input type="email" value="{{ email }}" onChange="{{ setEmail }}" placeholder="you@example.com" style="border:0;background:transparent;font:inherit;font-size:15px;color:#0F1B2D;outline:none;height:24px;padding:0">
    </div>
    <div style="display:flex;align-items:center;gap:8px;background:#F3F6FB;border-radius:14px;padding:10px 6px 10px 16px">
      <div style="flex:1;display:flex;flex-direction:column;gap:2px"><span style="font-size:11px;font-weight:600;color:#7B8794;text-transform:uppercase;letter-spacing:.4px">Password</span><input type="{{ pwType }}" value="{{ pw }}" onChange="{{ setPw }}" placeholder="Enter your password" style="border:0;background:transparent;font:inherit;font-size:15px;color:#0F1B2D;outline:none;height:24px;padding:0;width:100%"></div>
      <button onClick="{{ togglePw }}" aria-label="Toggle password visibility" style="width:40px;height:40px;border:0;background:transparent;border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#5B6B7F"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg></button>
    </div>
    <sc-if value="{{ isError }}" hint-placeholder-val="{{ false }}"><div role="alert" style="display:flex;gap:10px;align-items:center;background:#FEF2F2;color:#B91C1C;border-radius:12px;padding:10px 12px;font-size:13px;font-weight:500"><span style="width:8px;height:8px;border-radius:50%;background:#DC2626;flex:none"></span>Incorrect email or password. Try again.</div></sc-if>
    <div style="display:flex;justify-content:flex-end;padding-right:4px"><a href="#" style="font-size:13px;font-weight:600;text-decoration:none">Forgot password?</a></div>
    <button onClick="{{ signIn }}" disabled="{{ btnDisabled }}" style="height:54px;border:0;border-radius:999px;background:#1B6BF2;color:#fff;font:inherit;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;opacity:{{ btnOpacity }};box-shadow:0 8px 20px rgba(27,107,242,.28)">
      <sc-if value="{{ isLoading }}" hint-placeholder-val="{{ false }}"><span style="width:18px;height:18px;border-radius:50%;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;animation:pl-spin .8s linear infinite"></span></sc-if><span>{{ btnLabel }}</span>
    </button>
  </div>
  <div style="display:flex;align-items:center;gap:12px;margin-top:20px"><span style="flex:1;height:1px;background:#D7E0EE"></span><span style="font-size:12px;color:#7B8794">or continue with</span><span style="flex:1;height:1px;background:#D7E0EE"></span></div>
  <button style="height:52px;margin-top:14px;border:0;border-radius:999px;background:#fff;color:#0F1B2D;font:inherit;font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer"><span style="width:20px;height:20px;border-radius:50%;border:1px solid #E5E9F0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#1B6BF2">G</span>Continue with Google</button>
  <div style="flex:1"></div>
  <div style="text-align:center;font-size:12px;color:#7B8794;padding-top:24px">Returning user? <span style="color:#1B6BF2;font-weight:600">{{ bioLabel }}</span></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:402,&quot;height&quot;:874},&quot;platform&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;ios&quot;,&quot;android&quot;],&quot;default&quot;:&quot;ios&quot;,&quot;tsType&quot;:&quot;'ios'|'android'&quot;}}">
class Component extends DCLogic {
  state = { showPw: false, status: 'idle', email: 'mohammed@moosa.co.za', pw: '' };
  renderVals() {
    const { showPw, status, email, pw } = this.state, platform = this.props.platform ?? 'ios';
    const loading = status === 'loading', disabled = loading || !email || !pw;
    return {
      isIOS: platform === 'ios', bioLabel: platform === 'ios' ? 'Sign in with Face ID' : 'Sign in with fingerprint',
      pwType: showPw ? 'text' : 'password', togglePw: () => this.setState(s => ({ showPw: !s.showPw })), email, pw,
      setEmail: e => this.setState({ email: e.target.value, status: 'idle' }), setPw: e => this.setState({ pw: e.target.value, status: 'idle' }),
      isLoading: loading, isError: status === 'error', btnLabel: loading ? 'Signing in…' : 'Sign in', btnDisabled: disabled, btnOpacity: disabled && !loading ? 0.45 : 1,
      signIn: () => { if (disabled) return; this.setState({ status: 'loading' }); setTimeout(() => this.setState({ status: 'error' }), 1300); },
    };
  }
}
</script>
</body>
</html>
