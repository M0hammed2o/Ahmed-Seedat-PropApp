<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>body{margin:0}a{color:#5EA2FF}a:hover{color:#fff}@keyframes pl-spin{to{transform:rotate(360deg)}}</style></helmet>
<div style="font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:#0B1220;color:#fff;min-height:100%;height:100%;display:flex;flex-direction:column;box-sizing:border-box;-webkit-font-smoothing:antialiased;position:relative;overflow:hidden">
  <div style="position:absolute;top:-120px;right:-120px;width:360px;height:360px;border-radius:50%;background:radial-gradient(closest-side,rgba(27,107,242,.35),rgba(27,107,242,0))"></div>
  <sc-if value="{{ isIOS }}" hint-placeholder-val="{{ true }}"><div style="height:54px"></div></sc-if>
  <div style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:40px 24px 0;position:relative">
    <img src="assets/logo-mark.png" alt="Proplyst" style="width:84px;height:92px;object-fit:contain;margin-top:24px">
    <div style="font-size:30px;font-weight:800;letter-spacing:-0.6px;line-height:1.15;margin-top:22px">Welcome to<br>Proplyst</div>
    <div style="font-size:15px;color:#8FA3C2;margin-top:8px">Property intelligence simplified.</div>
  </div>
  <div style="background:#fff;color:#0F1B2D;border-radius:28px 28px 0 0;margin-top:28px;padding:26px 24px 36px;display:flex;flex-direction:column;gap:12px">
    <div style="display:flex;flex-direction:column;gap:6px">
      <span style="font-size:13px;font-weight:600;color:#3A4A5E">Email</span>
      <input type="email" value="{{ email }}" onChange="{{ setEmail }}" placeholder="you@example.com" style="height:52px;border:1px solid #E5E9F0;border-radius:14px;padding:0 16px;font:inherit;font-size:15px;color:#0F1B2D;background:#F6F8FB;outline:none" style-focus="border-color:#1B6BF2;background:#fff;box-shadow:0 0 0 3px #E8F0FE">
    </div>
    <div style="display:flex;flex-direction:column;gap:6px">
      <span style="font-size:13px;font-weight:600;color:#3A4A5E">Password</span>
      <div style="position:relative">
        <input type="{{ pwType }}" value="{{ pw }}" onChange="{{ setPw }}" placeholder="Enter your password" style="width:100%;box-sizing:border-box;height:52px;border:1px solid #E5E9F0;border-radius:14px;padding:0 48px 0 16px;font:inherit;font-size:15px;color:#0F1B2D;background:#F6F8FB;outline:none" style-focus="border-color:#1B6BF2;background:#fff;box-shadow:0 0 0 3px #E8F0FE">
        <button onClick="{{ togglePw }}" aria-label="Toggle password visibility" style="position:absolute;right:6px;top:6px;width:40px;height:40px;border:0;background:transparent;border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#5B6B7F"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg></button>
      </div>
    </div>
    <sc-if value="{{ isError }}" hint-placeholder-val="{{ false }}"><div role="alert" style="display:flex;gap:10px;align-items:center;background:#FEF2F2;border:1px solid #FECACA;color:#B91C1C;border-radius:12px;padding:10px 12px;font-size:13px;font-weight:500"><span style="width:8px;height:8px;border-radius:50%;background:#DC2626;flex:none"></span>Incorrect email or password. Try again.</div></sc-if>
    <div style="display:flex;justify-content:flex-end"><a href="#" style="font-size:13px;font-weight:600;text-decoration:none;color:#1B6BF2">Forgot password?</a></div>
    <button onClick="{{ signIn }}" disabled="{{ btnDisabled }}" style="height:54px;border:0;border-radius:14px;background:#1B6BF2;color:#fff;font:inherit;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;opacity:{{ btnOpacity }}">
      <sc-if value="{{ isLoading }}" hint-placeholder-val="{{ false }}"><span style="width:18px;height:18px;border-radius:50%;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;animation:pl-spin .8s linear infinite"></span></sc-if><span>{{ btnLabel }}</span>
    </button>
    <div style="display:flex;align-items:center;gap:12px;margin-top:4px"><span style="flex:1;height:1px;background:#E5E9F0"></span><span style="font-size:12px;color:#98A2B3">or continue with</span><span style="flex:1;height:1px;background:#E5E9F0"></span></div>
    <button style="height:52px;border:1px solid #E5E9F0;border-radius:14px;background:#fff;color:#0F1B2D;font:inherit;font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer"><span style="width:20px;height:20px;border-radius:50%;border:1px solid #E5E9F0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#1B6BF2">G</span>Continue with Google</button>
    <div style="text-align:center;font-size:12px;color:#98A2B3;margin-top:6px">Returning user? <span style="color:#1B6BF2;font-weight:600">{{ bioLabel }}</span></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:402,&quot;height&quot;:874},&quot;platform&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;ios&quot;,&quot;android&quot;],&quot;default&quot;:&quot;ios&quot;,&quot;tsType&quot;:&quot;'ios'|'android'&quot;}}">
class Component extends DCLogic {
  state = { showPw: false, status: 'idle', email: 'mohammed@moosa.co.za', pw: '' };
  renderVals() {
    const { showPw, status, email, pw } = this.state;
    const platform = this.props.platform ?? 'ios';
    const loading = status === 'loading', disabled = loading || !email || !pw;
    return {
      isIOS: platform === 'ios', bioLabel: platform === 'ios' ? 'Sign in with Face ID' : 'Sign in with fingerprint',
      pwType: showPw ? 'text' : 'password', togglePw: () => this.setState(s => ({ showPw: !s.showPw })), email, pw,
      setEmail: e => this.setState({ email: e.target.value, status: 'idle' }), setPw: e => this.setState({ pw: e.target.value, status: 'idle' }),
      isLoading: loading, isError: status === 'error', btnLabel: loading ? 'Signing in…' : 'Sign in', btnDisabled: disabled, btnOpacity: disabled && !loading ? 0.45 : 1,
      signIn: () => { if (disabled) return; this.setState({ status: 'loading' }); setTimeout(() => this.setState({ status: 'error' }), 1300); },
    };
  }
}
</script>
</body>
</html>
