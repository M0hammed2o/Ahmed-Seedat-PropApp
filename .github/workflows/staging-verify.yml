name: Staging verify

# Full regression for STAGING branches only (never main, never production). Runs on GitHub's runners so results do
# not depend on a developer laptop. Uses only the local Supabase CLI stack inside the runner — no hosted database,
# no secrets, every external provider unset (mock e-mail, no payments, no WhatsApp).
#   Push to a branch named staging/** or run it manually (Actions → Staging verify → Run workflow).
# The repository-wide Prettier check is NOT gated here: it already fails on main (291 files, pre-existing) and would
# stop the job before any real check runs (see docs/UTILITIES_PHASE3_VALIDATION_REPORT.md).

on:
  push:
    branches: ['staging/**']
  workflow_dispatch:

concurrency:
  group: staging-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Production build (demo mode, as in CI)
        run: pnpm --filter admin build
        env:
          NEXT_PUBLIC_DEMO_MODE: 'true'
          ALLOW_DEMO_MODE: 'true'
          NODE_OPTIONS: --max-old-space-size=6144

  database-and-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.111.0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start local Supabase (inside the runner)
        run: supabase start
      - name: Fresh migrations 001→latest
        run: supabase db reset
      - name: pgTAP (RLS, isolation, utilities)
        run: supabase test db
      - name: Vitest (unit + integration against the runner's local Supabase)
        working-directory: apps/admin
        run: npx vitest run
      - if: always()
        run: supabase stop

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.111.0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start local Supabase and ClamAV
        run: |
          supabase start
          supabase db reset
          docker compose up -d clamav
          for i in $(seq 1 60); do
            if (exec 3<>/dev/tcp/127.0.0.1/3310 && printf 'PING\n' >&3 && timeout 3 head -c 4 <&3) 2>/dev/null | grep -q PONG; then echo "clamav ready"; break; fi
            sleep 10
          done
      - name: Install Chromium
        working-directory: apps/admin
        run: npx playwright install --with-deps chromium
      # The fictional cemetery + property demo year (scripts/cemetery-demo), provisioned twice into the runner's own
      # database: the second run must change nothing (idempotency). e2e/demo-year.spec.ts then browses it.
      - name: Provision the demo year (twice — idempotency)
        working-directory: apps/admin
        env:
          CEMDEMO_SUPABASE_URL: http://127.0.0.1:54321
          CEMDEMO_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU
          CEMDEMO_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
          CEMDEMO_CREDENTIALS_FILE: ${{ runner.temp }}/cemetery-demo.env.local
          CEMDEMO_CONFIRM: seed-cemetery-demo
        run: |
          npx vitest run -c vitest.demo.config.ts scripts/cemetery-demo/provision.demo.ts
          CEMDEMO_EXPECT_NO_CHANGES=1 npx vitest run -c vitest.demo.config.ts scripts/cemetery-demo/provision.demo.ts
      - name: Playwright (whole app, one worker, CI retry policy)
        working-directory: apps/admin
        run: npx playwright test --workers=1 --reporter=list,html
        env:
          CI: '1'
          CLAMAV_HOST: 127.0.0.1
          CLAMAV_PORT: '3310'
          CEMDEMO_CREDENTIALS_FILE: ${{ runner.temp }}/cemetery-demo.env.local
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/admin/playwright-report
            apps/admin/test-results
          retention-days: 7
      - if: always()
        run: supabase stop
